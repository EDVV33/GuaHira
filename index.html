<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>3D Model Viewer</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f0f0f0;font-family:sans-serif;opacity:0;animation:fadeIn .35s ease forwards}
@keyframes fadeIn{to{opacity:1}}
body{display:flex;justify-content:center;align-items:center}
model-viewer{width:100%;height:100%;background:#fff;--poster-color:transparent;opacity:0;transition:opacity .5s ease;will-change:opacity;contain:layout paint size}
model-viewer.ready{opacity:1}
#gate{position:fixed;inset:0;background:#f0f0f0;display:flex;justify-content:center;align-items:center;z-index:100;opacity:1;transition:opacity .35s ease,transform .35s ease;will-change:opacity,transform}
#gate.hidden{opacity:0;transform:scale(1.02);pointer-events:none}
#gate .card{background:#fff;padding:28px 24px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.15);text-align:center;width:80%;max-width:320px;animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#gate h2{margin:0 0 16px;font-size:18px;color:#222}
#gate input{width:100%;padding:10px 12px;font-size:16px;border:1px solid #ccc;border-radius:6px;outline:none;transition:border-color .2s,box-shadow .2s}
#gate input:focus{border-color:#2196F3;box-shadow:0 0 0 3px rgba(33,150,243,.15)}
#gate button{margin-top:12px;width:100%;background:#2196F3;color:#fff;border:none;padding:10px;border-radius:6px;font-size:16px;cursor:pointer;transition:background .2s,transform .1s}
#gate button:hover{background:#1976D2}
#gate button:active{transform:scale(.98)}
#gate button:disabled{opacity:.6;cursor:default}
#gate .error{color:#d32f2f;font-size:13px;min-height:18px;margin-top:10px;opacity:0;transition:opacity .2s}
#gate .error.show{opacity:1}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(255,255,255,.65);z-index:5;opacity:0;pointer-events:none;transition:opacity .3s ease}
#loading.show{opacity:1}
#loading.hide{opacity:0}
.spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:#2196F3;border-radius:50%;animation:spin .8s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{margin:14px 0 0;font-size:14px;color:#666;letter-spacing:.3px}
#loading p::after{content:"";animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}
#fallback{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;padding:15px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);display:none;z-index:10;width:80%;max-width:300px;text-align:center;animation:cardIn .35s ease both}
</style>
</head>
<body>
<div id="gate"><div class="card"><h2>Enter password</h2><input id="pw" type="password" autocomplete="off" autofocus><button id="pwBtn">Unlock</button><div class="error" id="pwErr"></div></div></div>
<div id="loading"><div class="spinner"></div><p>Loading 3D model</p></div>
<div id="fallback"><p style="margin:0 0 10px;font-size:14px;color:#333">Browser blocked the local file. Please select your <b>.glb</b> file manually:</p><input type="file" id="fileInput" accept=".glb"></div>
<model-viewer id="viewer" alt="A 3D model" camera-controls auto-rotate auto-rotate-delay="3000" rotation-per-second="12deg" interaction-prompt="none" min-field-of-view="30deg" max-field-of-view="60deg" shadow-intensity="0.5" touch-action="pan-y" loading="eager" reveal="auto"></model-viewer>
<script>
const PASSWORD_HASH="f223faa96f22916294922b171a2696d868fd1f9129302eb41a45b2a2ea2ebbfd";
const viewer=document.getElementById("viewer"),gate=document.getElementById("gate"),pwInput=document.getElementById("pw"),pwBtn=document.getElementById("pwBtn"),pwErr=document.getElementById("pwErr"),loading=document.getElementById("loading"),fallbackUI=document.getElementById("fallback"),fileInput=document.getElementById("fileInput");
const dpr=window.devicePixelRatio||1;
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||window.innerWidth<768;
const lowPower=isMobile||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||dpr>=3;
async function sha256(text){const buf=new TextEncoder().encode(text);const digest=await crypto.subtle.digest("SHA-256",buf);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function tryUnlock(){pwErr.classList.remove("show");pwBtn.disabled=true;const hash=await sha256(pwInput.value);if(hash===PASSWORD_HASH){gate.classList.add("hidden");setTimeout(()=>gate.remove(),380);startViewer()}else{pwErr.textContent="Wrong password.";pwErr.classList.add("show");pwInput.value="";pwInput.focus();pwBtn.disabled=false}}
pwBtn.addEventListener("click",tryUnlock);
pwInput.addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock()});
function startViewer(){
  loading.classList.add("show");
  if(lowPower){
    viewer.removeAttribute("shadow-intensity");
    viewer.setAttribute("rotation-per-second","8deg");
    viewer.setAttribute("environment-image","neutral");
    viewer.setAttribute("max-pixel-ratio","1.5");
  }else{
    viewer.setAttribute("max-pixel-ratio","2");
  }
  viewer.src="model.glb";
  viewer.addEventListener("load",()=>{
    requestAnimationFrame(()=>{viewer.classList.add("ready");loading.classList.add("hide");setTimeout(()=>loading.style.display="none",320)})
  },{once:true});
  viewer.addEventListener("error",e=>{
    loading.classList.add("hide");setTimeout(()=>loading.style.display="none",320);
    if(location.protocol==="file:"){fallbackUI.style.display="block"}else{console.error("Model failed to load.",e)}
  },{once:true});
  fileInput.addEventListener("change",ev=>{const f=ev.target.files[0];if(f){viewer.src=URL.createObjectURL(f);fallbackUI.style.display="none"}});
}
</script>
</body>
</html>
